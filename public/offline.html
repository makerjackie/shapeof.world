<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1ecdf" />
    <title>Shape of the World · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; background: #f1ecdf; color: #19231f; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 32px; }
      main { width: min(620px, 100%); border-top: 1px solid rgba(25,35,31,.22); padding-top: 28px; }
      small { font: 600 11px/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 28px 0 16px; font-size: clamp(46px, 10vw, 82px); font-weight: 400; letter-spacing: -.045em; line-height: .92; }
      p { max-width: 470px; margin: 0; color: #53605a; font: 400 16px/1.65 system-ui, sans-serif; }
      p + p { margin-top: 12px; }
      a { display: inline-flex; min-height: 46px; align-items: center; margin-top: 34px; padding: 0 18px; border: 1px solid #19231f; color: inherit; text-decoration: none; font: 600 12px/1 system-ui, sans-serif; }
      a:focus-visible { outline: 2px solid #b85c4c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>Shape of the World · 暂时离线 / Offline</small>
      <h1>世界还在这里。</h1>
      <p>网络恢复后，再回来继续探索。你此前打开过的部分资源仍可能保存在这台设备上。</p>
      <p lang="en">Reconnect and return when you are ready. Parts of worlds you opened before may still be available on this device.</p>
      <a href="/">重新连接 · Try again</a>
    </main>
  </body>
</html>

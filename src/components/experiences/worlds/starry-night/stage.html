<canvas id="scene" tabindex="0" aria-label="可自由飞行的三维星夜村庄"></canvas>

<div id="tourCaption" data-experience-overlay="true"><div class="flight-caption"><small id="chapter"></small><p id="chapterText"></p></div><div class="flight-timeline"><button id="pauseFlight" aria-label="暂停飞行">Ⅱ</button><input id="flightSeek" type="range" min="0" max="24" step=".1" value="0" aria-label="飞行进度"><small id="flightClock"></small><button id="takeoverBtn" data-i18n="takeover"></button></div></div>
<div id="roamUI" hidden data-experience-overlay="true"><div id="placeNote"><small id="placeNumber"></small><b id="placeTitle"></b><p id="placeDescription"></p></div><p id="movementHint"><span class="desktop-hint" data-i18n="moveHint"></span><span class="touch-hint" data-i18n="moveHintTouch"></span></p></div>
